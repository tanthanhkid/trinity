name: Setup workspace
description: Cài pnpm + Node 22, cài dependency (có cache), tuỳ chọn tạo Prisma client và build gói dùng chung.
inputs:
  prisma:
    description: Tạo Prisma client
    default: "true"
  packages:
    description: Build các gói trong packages/*
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 10.6.5
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
    - name: Generate Prisma clients
      if: inputs.prisma == 'true'
      shell: bash
      run: pnpm --filter @trinity/prisma generate
    - name: Build shared packages
      if: inputs.packages == 'true'
      shell: bash
      run: pnpm --filter "./packages/*" --if-present build
