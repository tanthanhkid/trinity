# ĐÓNG BĂNG cập nhật phiên bản từ 26/11/2026 trong lúc viết lại backend sang Rust (docs/rust/PLAN.md): mỗi PR
# Dependabot tốn cả lượt CI và làm hàng đợi runner dài thêm. `open-pull-requests-limit: 0` chỉ tắt PR cập nhật phiên
# bản; PR vá lỗ hổng (Dependabot security updates, bật trong Settings → Code security) vẫn mở như cũ vì có giới hạn
# riêng. Mở lại: trả các giới hạn về 5 / 3 / 3 / 2 (npm / cargo / github-actions / docker). Xem docs/ci.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, server]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
