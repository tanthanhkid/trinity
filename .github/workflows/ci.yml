name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Install, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Shape-only values: nothing here talks to a real database or service.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      NEXT_PUBLIC_API_URL: /api/v1
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build web and monolith
        run: |
          pnpm --filter @trinity/monolith build
          pnpm --filter web build

  sql-postgres:
    # Câu SQL raw / transaction chạy trên Postgres THẬT — unit test dùng mock không bắt được lỗi kiểu
    # `left(varchar, bigint)` (từng làm webhook SePay trả 500). Test: `**/*.pg.spec.ts`.
    name: SQL on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Apply migrations
        run: pnpm --filter @trinity/prisma exec prisma migrate deploy

      - name: SQL tests on Postgres
        working-directory: services/crm
        run: npx jest --testRegex '\.pg\.spec\.ts$' --runInBand

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
