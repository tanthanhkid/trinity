name: CI

# Tối giản (Thanh 16/10): chỉ chạy trên PR, không chạy lại trên main sau merge. Deploy tự build — build hỏng thì
# deploy dừng và bản đang chạy giữ nguyên. Lint chạy ở máy dev; image Docker chỉ build khi gắn tag (docker.yml).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Typecheck and tests (changed packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shape-only values: nothing here talks to a real database or service.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      NEXT_PUBLIC_API_URL: /api/v1
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      # Typecheck: package bị đổi + package phụ thuộc ("...[base]"). Test: chỉ package bị đổi ("[base]") để job dưới 2 phút.
      - name: Typecheck (changed packages)
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" --if-present typecheck

      - name: Unit tests (changed packages)
        run: pnpm --filter "[origin/${{ github.base_ref }}]" --if-present test

  sql-postgres:
    # Câu SQL raw / transaction chạy trên Postgres THẬT — unit test dùng mock không bắt được lỗi kiểu
    # `left(varchar, bigint)` (từng làm webhook SePay trả 500). Test: `**/*.pg.spec.ts`.
    name: SQL on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      # Test DB thật vốn bị bỏ qua khi thiếu biến này (luồng POS, phạm vi quyền) — dùng chung Postgres của job.
      POS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      RBAC_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Chỉ chạy khi đổi migration, schema, test SQL (*.pg.spec.ts) hoặc file có SQL viết tay ($queryRaw/$executeRaw).
      - name: Detect SQL changes
        id: sql
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '(prisma/migrations/|schema\.prisma$|\.(pg|db)\.spec\.ts$|services/commerce/src/pos/|packages/rbac-nest/src/|services/auth/src/users/|\.github/workflows/ci\.yml$)'; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in $(echo "$files" | grep -E '\.ts$' || true); do
            if [ -f "$f" ] && grep -qE '\$(queryRaw|executeRaw)' "$f"; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.sql.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter "./packages/*" build

      - name: Apply migrations
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma exec prisma migrate deploy

      - name: SQL tests on Postgres
        if: steps.sql.outputs.run == 'true'
        working-directory: services/crm
        run: npx jest --testRegex '(\.pg\.spec|\.db\.spec|extensions\.service\.spec)\.ts$' --runInBand

      # services/commerce (sản phẩm, POS) có test SQL riêng — chạy trên cùng Postgres sau crm.
      - name: SQL tests on Postgres (commerce)
        if: steps.sql.outputs.run == 'true'
        working-directory: services/commerce
        run: npx jest --testRegex '(\.pg\.spec|pos-flow\.integration\.spec)\.ts$' --runInBand --passWithNoTests

      # Phạm vi quyền (rbac-nest) và xoá cache quyền khi đổi quản lý (auth) — test DB thật, TRUNCATE users/user_roles.
      - name: SQL tests on Postgres (rbac + auth)
        if: steps.sql.outputs.run == 'true'
        run: |
          (cd packages/rbac-nest && npx jest --testRegex 'scope\.service\.spec\.ts$' --runInBand)
          (cd services/auth && npx jest --testRegex 'users-manager-cache-invalidation\.spec\.ts$' --runInBand)

  web-ui:
    # Web: build thật (thay cho build tay trước khi duyệt) + đo trên Chrome headless (docs/TRANG-THAI.md):
    # tương phản, nền tảng UI (vùng chạm, focus, tràn ngang, chuyển động) và "cố tình phá" (mất mạng, 500/401, trống,
    # token kênh hết hạn, đăng bài lỗi, hoàn tác). API giả qua CDP Fetch — không có máy chủ, không có dữ liệu thật.
    name: Web build and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://localhost:3917
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Chỉ chạy khi PR đụng web hoặc gói dùng chung mà web phụ thuộc.
      - name: Detect web changes
        id: web
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(apps/web/|packages/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.web.outputs.run == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.web.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.web.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter "./packages/*" --if-present build

      - name: next build
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter ./apps/web build

      # JS tải lần đầu theo route (gzip) so với apps/web/route-js-budget.json — bảng in vào tóm tắt job.
      - name: Route JS budget
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node scripts/route-js-size.mjs

      - name: Contrast (design tokens)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/premium/contrast.mjs

      # Bản standalone (cách chạy trên máy chủ tự quản): chép static + public cạnh server.js rồi chạy ở cổng 3917.
      - name: Start web (standalone)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/apps/web/.next/static
          if [ -d public ]; then cp -r public .next/standalone/apps/web/public; fi
          PORT=3917 HOSTNAME=127.0.0.1 nohup node .next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3917/login && exit 0; sleep 1; done
          cat /tmp/web.log; exit 1

      # Chrome có sẵn trên ubuntu-latest (channel "chrome"); hồ sơ tạm mỗi lần chạy.
      - name: UI audit (touch targets, focus, overflow, motion)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/premium/ui-audit.mjs > /tmp/ui-audit.json

      - name: Break-it scenarios
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: |
          if [ -f e2e/premium/break-it.mjs ]; then node e2e/premium/break-it.mjs; else echo "break-it.mjs chưa có trên nhánh này"; fi

      - name: Web server log (on failure)
        if: failure() && steps.web.outputs.run == 'true'
        run: tail -n 200 /tmp/web.log || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
