name: CI

# Tối giản (Thanh 16/10): chỉ chạy trên PR, không chạy lại trên main sau merge. Deploy tự build — build hỏng thì
# deploy dừng và bản đang chạy giữ nguyên. Lint chạy ở máy dev; image Docker chỉ build khi gắn tag (docker.yml).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Typecheck and tests (changed packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shape-only values: nothing here talks to a real database or service.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      NEXT_PUBLIC_API_URL: /api/v1
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      # Typecheck: package bị đổi + package phụ thuộc ("...[base]"). Test: chỉ package bị đổi ("[base]") để job dưới 2 phút.
      - name: Typecheck (changed packages)
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" --if-present typecheck

      - name: Unit tests (changed packages)
        run: pnpm --filter "[origin/${{ github.base_ref }}]" --if-present test

  sql-postgres:
    # Câu SQL raw / transaction chạy trên Postgres THẬT — unit test dùng mock không bắt được lỗi kiểu
    # `left(varchar, bigint)` (từng làm webhook SePay trả 500). Test: `**/*.pg.spec.ts`.
    name: SQL on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Chỉ chạy khi đổi migration, schema, test SQL (*.pg.spec.ts) hoặc file có SQL viết tay ($queryRaw/$executeRaw).
      - name: Detect SQL changes
        id: sql
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '(prisma/migrations/|schema\.prisma$|\.pg\.spec\.ts$)'; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in $(echo "$files" | grep -E '\.ts$' || true); do
            if [ -f "$f" ] && grep -qE '\$(queryRaw|executeRaw)' "$f"; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.sql.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter "./packages/*" build

      - name: Apply migrations
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma exec prisma migrate deploy

      - name: SQL tests on Postgres
        if: steps.sql.outputs.run == 'true'
        working-directory: services/crm
        run: npx jest --testRegex '\.pg\.spec\.ts$' --runInBand

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
