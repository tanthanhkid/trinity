name: CI

# PR: lint / typecheck / unit (TS) và Rust fmt / clippy / unit chạy song song theo phần thay đổi; `ci-ok` là check bắt
# buộc duy nhất (cùng gitleaks + CLA). Push main: chạy đủ (không lọc). Job nặng (Postgres thật, build + kiểm giao diện
# web, build api, build Rust release, test pg Rust) KHÔNG bắt buộc.
# Chi tiết: docs/ci.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Giá trị chỉ có hình dạng: không có gì ở đây nối tới DB hay dịch vụ thật.
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  JWT_SECRET: ci-test-secret-not-real-do-not-use
  SERVICE_SECRET: ci-test-service-secret-do-not-use
  NEXT_PUBLIC_API_URL: /api/v1
  CI: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          prisma: "false"
          packages: "false"
      # PR: chỉ package bị đổi ("[base]"). Push main: tất cả.
      - name: ESLint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter "[origin/${{ github.base_ref }}]" --if-present lint
          else
            pnpm -r --if-present lint
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PR: package bị đổi + package phụ thuộc ("...[base]"). Push main: tất cả.
      - name: Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter "...[origin/${{ github.base_ref }}]" --if-present typecheck
          else
            pnpm -r --if-present typecheck
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PR: chỉ package bị đổi ("[base]"). Push main: tất cả.
      - name: Unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter "[origin/${{ github.base_ref }}]" --if-present test
          else
            pnpm -r --if-present test
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lọc thay đổi cho mọi job Rust (một chỗ, để các job không lệch nhau). Push main / chạy tay: tất cả là true.
  # - rust: server/, action rust-toolchain hoặc ci.yml → fmt, clippy, unit, build.
  # - rust_pg: thêm migration/schema Prisma (lệch schema chỉ lộ ra khi chạy trên DB thật) → Rust pg tests.
  # - rust_deps: Cargo.toml/Cargo.lock/deny.toml trong server/ hoặc ci.yml → Rust deny.
  rust-changes:
    name: Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      rust_pg: ${{ steps.f.outputs.rust_pg }}
      rust_deps: ${{ steps.f.outputs.rust_deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect Rust changes
        id: f
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'rust=true\nrust_pg=true\nrust_deps=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          has() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            echo "rust=$(has '^(server/|\.github/workflows/ci\.yml$)')"
            echo "rust_pg=$(has '^(server/|packages/prisma/prisma/|\.github/workflows/ci\.yml$)')"
            echo "rust_deps=$(has '^(server/(.*/)?Cargo\.(toml|lock)$|server/deny\.toml$|\.github/workflows/ci\.yml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  # Rust bắt buộc (docs/rust/PLAN.md mục 8): fmt, clippy, unit nằm trong `ci-ok`. Job luôn chạy (để `ci-ok` có kết quả)
  # nhưng các bước chỉ thực thi khi `rust-changes` báo rust=true; PR không đụng server/ thì mỗi job xong trong vài giây.
  # Cache rust-cache riêng từng job (clippy dựng .rmeta, test dựng thư viện đầy đủ: dùng chung khoá thì job lưu sau bị
  # bỏ vì khoá cache không ghi đè được); lưu ở push main và chạy tay, PR chỉ đọc.
  rust-fmt:
    name: Rust fmt
    needs: rust-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.rust-changes.outputs.rust == 'true'
      - uses: ./.github/actions/rust-toolchain
        if: needs.rust-changes.outputs.rust == 'true'
      - name: cargo fmt --check
        if: needs.rust-changes.outputs.rust == 'true'
        working-directory: server
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust clippy
    needs: rust-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.rust-changes.outputs.rust == 'true'
      - uses: ./.github/actions/rust-toolchain
        if: needs.rust-changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.rust-changes.outputs.rust == 'true'
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: cargo clippy
        if: needs.rust-changes.outputs.rust == 'true'
        working-directory: server
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-unit:
    name: Rust unit
    needs: rust-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.rust-changes.outputs.rust == 'true'
      - uses: ./.github/actions/rust-toolchain
        if: needs.rust-changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.rust-changes.outputs.rust == 'true'
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}
      # Mọi test không cần DB: unit trong lib/bin, test tích hợp trong tests/, doctest. Test pg có #[ignore] nên bị bỏ
      # qua ở đây; job `Rust pg tests` chạy chúng.
      - name: cargo test
        if: needs.rust-changes.outputs.rust == 'true'
        working-directory: server
        run: cargo test --locked --workspace

  # Check bắt buộc duy nhất của luồng CI (cộng CLA ở workflow riêng). Chạy `always()` để job bị bỏ qua/huỷ không làm treo merge.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, typecheck, unit, secret-scan, rust-changes, rust-fmt, rust-clippy, rust-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tổng hợp kết quả
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result != "success")' >/dev/null; then
            echo "::error::Có job bắt buộc không xanh"; exit 1
          fi

  build-api:
    name: Build api (monolith)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @trinity/monolith build

  sql-postgres:
    # Câu SQL raw / transaction chạy trên Postgres THẬT — unit test dùng mock không bắt được lỗi kiểu
    # `left(varchar, bigint)` (từng làm webhook SePay trả 500). Test: `**/*.pg.spec.ts`.
    name: Tests with Postgres (migrate + db specs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      # Test DB thật vốn bị bỏ qua khi thiếu biến này (luồng POS, phạm vi quyền) — dùng chung Postgres của job.
      POS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      RBAC_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      JWT_SECRET: ci-test-secret-not-real-do-not-use
      SERVICE_SECRET: ci-test-service-secret-do-not-use
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Chỉ chạy khi đổi migration, schema, test SQL (*.pg.spec.ts) hoặc file có SQL viết tay ($queryRaw/$executeRaw).
      - name: Detect SQL changes
        id: sql
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '(prisma/migrations/|schema\.prisma$|\.(pg|db)\.spec\.ts$|services/commerce/src/pos/|packages/rbac-nest/src/|services/auth/src/users/|\.github/workflows/ci\.yml$)'; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in $(echo "$files" | grep -E '\.ts$' || true); do
            if [ -f "$f" ] && grep -qE '\$(queryRaw|executeRaw)' "$f"; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.sql.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.sql.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter "./packages/*" build

      - name: Apply migrations
        if: steps.sql.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma exec prisma migrate deploy

      - name: SQL tests on Postgres
        if: steps.sql.outputs.run == 'true'
        working-directory: services/crm
        run: npx jest --testRegex '(\.pg\.spec|\.db\.spec)\.ts$' --runInBand

      # services/commerce (sản phẩm, POS) có test SQL riêng — chạy trên cùng Postgres sau crm.
      - name: SQL tests on Postgres (commerce)
        if: steps.sql.outputs.run == 'true'
        working-directory: services/commerce
        run: npx jest --testRegex '(\.pg\.spec|pos-flow\.integration\.spec)\.ts$' --runInBand --passWithNoTests

      # Phạm vi quyền (rbac-nest) và xoá cache quyền khi đổi quản lý (auth) — test DB thật, TRUNCATE users/user_roles.
      - name: SQL tests on Postgres (rbac + auth)
        if: steps.sql.outputs.run == 'true'
        run: |
          (cd packages/rbac-nest && npx jest --testRegex 'scope\.service\.spec\.ts$' --runInBand)
          (cd services/auth && npx jest --testRegex '(users-manager-cache-invalidation\.spec|invitations\.pg\.spec)\.ts$' --runInBand)

  web-ui:
    # Web: build thật (thay cho build tay trước khi duyệt) + đo trên Chrome headless (docs/TRANG-THAI.md):
    # tương phản, nền tảng UI (vùng chạm, focus, tràn ngang, chuyển động) và "cố tình phá" (mất mạng, 500/401, trống,
    # token kênh hết hạn, đăng bài lỗi, hoàn tác). API giả qua CDP Fetch — không có máy chủ, không có dữ liệu thật.
    name: Web build and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://localhost:3917
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Chỉ chạy khi PR đụng web hoặc gói dùng chung mà web phụ thuộc.
      - name: Detect web changes
        id: web
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(apps/web/|packages/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.web.outputs.run == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.web.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.web.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma clients
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter @trinity/prisma generate

      - name: Build shared packages
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter "./packages/*" --if-present build

      - name: Cache next build
        if: steps.web.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: next build
        if: steps.web.outputs.run == 'true'
        run: pnpm --filter ./apps/web build

      # JS tải lần đầu theo route (gzip) so với apps/web/route-js-budget.json — bảng in vào tóm tắt job.
      - name: Route JS budget
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node scripts/route-js-size.mjs

      - name: Contrast (design tokens)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/premium/contrast.mjs

      # Bản standalone (cách chạy trên máy chủ tự quản): chép static + public cạnh server.js rồi chạy ở cổng 3917.
      - name: Start web (standalone)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/apps/web/.next/static
          if [ -d public ]; then cp -r public .next/standalone/apps/web/public; fi
          PORT=3917 HOSTNAME=127.0.0.1 nohup node .next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3917/login && exit 0; sleep 1; done
          cat /tmp/web.log; exit 1

      # Chrome có sẵn trên ubuntu-latest (channel "chrome"); hồ sơ tạm mỗi lần chạy.
      - name: UI audit (touch targets, focus, overflow, motion)
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/premium/ui-audit.mjs > /tmp/ui-audit.json

      - name: Break-it scenarios
        if: steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: |
          if [ -f e2e/premium/break-it.mjs ]; then node e2e/premium/break-it.mjs; else echo "break-it.mjs chưa có trên nhánh này"; fi

      - name: Upload UI audit
        if: always() && steps.web.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit
          path: /tmp/ui-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Web server log (on failure)
        if: failure() && steps.web.outputs.run == 'true'
        run: tail -n 200 /tmp/web.log || true

  # Backend Rust (docs/rust/PLAN.md mục 8): build release cho cả hai kiến trúc máy chủ. Không bắt buộc; fmt/clippy/unit
  # là các job `rust-*` trong `ci-ok`. Build offline (.sqlx/) không bắt được lệch schema Prisma, nên không chạy theo
  # migration ở đây: việc đó thuộc `rust-pg`.
  rust-build:
    name: Rust build (${{ matrix.arch }})
    needs: rust-changes
    if: needs.rust-changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Kiểm truy vấn bằng server/.sqlx/, không cần DB.
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: cargo build --release
        working-directory: server
        run: cargo build --release --locked --workspace --all-targets

      - name: trinity --version
        working-directory: server
        run: |
          ./target/release/trinity --version
          file ./target/release/trinity

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trinity-linux-${{ matrix.arch }}
          path: server/target/release/trinity
          if-no-files-found: error
          retention-days: 7

  # Giấy phép tương thích AGPL-3.0, lỗ hổng RustSec, nguồn crate theo server/deny.toml. Không bắt buộc.
  # Advisories (RustSec) chỉ chạy trên PR đổi phụ thuộc (và hằng đêm ở nightly.yml): advisory mới công bố không làm
  # đỏ push main khi không ai đổi phụ thuộc. Push main chỉ kiểm bans, licenses, sources.
  rust-deny:
    name: Rust deny
    needs: rust-changes
    if: needs.rust-changes.outputs.rust_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: server/Cargo.toml
          command: check
          command-arguments: ${{ github.event_name == 'pull_request' && 'advisories bans licenses sources' || 'bans licenses sources' }}

  # Test pg của Rust trên Postgres 16 thật (PLAN mục 8). Không bắt buộc vì cần DB; K06–K21 lấy job này làm tiêu chí.
  # - Migrate bằng Prisma (lịch sử migration vẫn là thư mục Prisma, PLAN 4.5); migrator Rust thêm vào đây khi có.
  # - `cargo sqlx prepare --check` nối DB thật (không offline): `.sqlx/` cũ hoặc lệch schema Prisma thì đỏ.
  # - Chạy các test `#[ignore]` (quy ước: chỉ test pg mới được #[ignore], server/README.md) trong lib/bin/tests/,
  #   không chạy doctest. Prisma CLI có sẵn ở PRISMA_BIN cho test so với Prisma (prisma_compat); user `test` là
  #   superuser nên test tạo được DB phụ.
  rust-pg:
    name: Rust pg tests
    needs: rust-changes
    if: needs.rust-changes.outputs.rust_pg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_rust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Luôn ghi rõ user trong URL: Prisma không tự lấy user hệ điều hành như libpq (thiếu thì P1010).
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_rust_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_rust_test
      PRISMA_BIN: ${{ github.workspace }}/packages/prisma/node_modules/.bin/prisma
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Chỉ cài gói prisma (không build cả monorepo): `prisma migrate deploy` và Prisma CLI cho test.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install prisma
        run: |
          pnpm install --frozen-lockfile --prefer-offline --filter @trinity/prisma
          "$PRISMA_BIN" --version

      - name: Migrate (Prisma)
        run: pnpm --filter @trinity/prisma exec prisma migrate deploy

      - uses: ./.github/actions/rust-toolchain

      # cache-bin (mặc định) giữ ~/.cargo/bin, nên sqlx-cli chỉ biên dịch lần đầu sau mỗi lần đổi khoá cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      # Cùng phiên bản với server/README.md (khớp sqlx trong Cargo.lock).
      - name: Install sqlx-cli
        run: |
          if ! cargo sqlx --version 2>/dev/null | grep -q ' 0\.9\.1$'; then
            cargo install sqlx-cli --version 0.9.1 --no-default-features --features postgres,rustls --locked
          fi
          cargo sqlx --version

      - name: cargo sqlx prepare --check
        working-directory: server
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --workspace --check

      - name: cargo test --tests -- --ignored (test pg)
        working-directory: server
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --locked --workspace --tests -- --ignored
