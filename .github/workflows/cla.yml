# CLA Assistant Lite: người góp mã ký CLA.md một lần bằng một bình luận trên PR. Chữ ký lưu ở nhánh `cla-signatures` của
# chính repo, dùng GITHUB_TOKEN có sẵn (không app ngoài, không PAT). pull_request_target KHÔNG checkout mã của PR.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/tanthanhkid/trinity/blob/main/CLA.md
          branch: cla-signatures
          allowlist: tanthanhkid,dependabot[bot],github-actions[bot],chatgpt-codex-connector[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: 'Thanks for your pull request! Before we can merge it, please read the [Contributor License Agreement](https://github.com/tanthanhkid/trinity/blob/main/CLA.md) and sign it by commenting the sentence below. You only need to do this once. · Cảm ơn bạn! Trước khi merge, bạn đọc CLA rồi ký bằng cách bình luận đúng câu dưới đây (chỉ một lần).'
