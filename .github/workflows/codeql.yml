name: CodeQL

# Thay "default setup" của GitHub (vốn chạy cả trên mọi PR): chỉ chạy trên push main, hằng tuần và chạy tay để PR không
# xếp hàng chờ runner trong giai đoạn viết lại Rust (docs/ci.md). Không bắt buộc cho merge.
# Cần TẮT default setup thì kết quả của workflow này mới được nhận (xem docs/ci.md, mục CodeQL).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 20 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: default
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
