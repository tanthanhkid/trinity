name: Docker image

# Dựng hai image (api, web) từ Dockerfile gốc, đa nền tảng amd64 + arm64, đẩy lên GHCR kèm SBOM, provenance và chữ ký cosign
# (keyless). Chạy khi: gắn tag v* bằng tay, release-please tạo release (workflow_call từ release.yml), hoặc chạy tay để thử
# (workflow_dispatch: chỉ amd64, KHÔNG đẩy, trừ khi chọn push).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag phát hành, vd v0.4.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag để gắn cho image (vd v0.4.0), bỏ trống = chỉ build thử
        required: false
        type: string
      push:
        description: Đẩy lên GHCR
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    env:
      REF_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      DO_PUSH: ${{ (github.event_name != 'workflow_dispatch') || inputs.push }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'workflow_dispatch'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF_TAG }},enable=${{ env.REF_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF_TAG }},enable=${{ env.REF_TAG != '' }}
            type=raw,value=latest,enable=${{ env.REF_TAG != '' }}
            type=sha

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Attest build provenance
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: env.DO_PUSH == 'true'

      - name: Sign image (cosign keyless)
        if: env.DO_PUSH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
