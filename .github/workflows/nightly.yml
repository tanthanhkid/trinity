name: Nightly

# Hằng đêm (≈02:00 giờ Việt Nam): chạy TOÀN BỘ test, test Postgres thật, e2e Playwright, kiểm lỗ hổng dependency.
# Không bắt buộc cho merge; lỗi ở đây là việc cần xử lý, không chặn PR.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Giây chạy mỗi target fuzz (đêm: 600; kiểm tiêu chí X10 chạy tay: 3600)"
        required: false
        default: "600"

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  JWT_SECRET: ci-test-secret-not-real-do-not-use
  SERVICE_SECRET: ci-test-service-secret-do-not-use
  INTERNAL_SERVICE_SECRET: ci-test-service-secret-do-not-use
  NEXT_PUBLIC_API_URL: /api/v1
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  full-test:
    name: Full unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present test

  db:
    name: Postgres thật (toàn bộ *.pg / *.db spec)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_sql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      POS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
      RBAC_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/trinity_sql_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @trinity/prisma exec prisma migrate deploy
      - run: (cd packages/rbac-nest && npx jest --testRegex 'scope\.service\.spec\.ts$' --runInBand)

  # Job e2e cũ (monolith Node + serve-export.mjs) đã gỡ: đường Node bị bỏ (#264) và monolith không còn khởi động được trên runner
  # (STORAGE_LOCAL_ROOT, #563). Bộ smoke/rbac chạy qua job này, trên binary Rust.
  e2e-static:
    # W04: cùng bộ smoke + rbac-ui + rbac-api, thêm `static-web`, nhưng web do binary Rust phục vụ từ `out/` (K18, W02a),
    # không có Next server và không có monolith Node. Playwright tự khởi động binary (E2E_SERVER=rust). Chỉ đọc.
    # Cần K18 và W02a trên main (`pnpm build:export`, `WEB_DIR`).
    name: E2E Playwright (web tĩnh do Rust phục vụ)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trinity_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d trinity_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgresql://test:test@localhost:5432/trinity_e2e
      JWT_SECRET: ci-e2e-jwt-secret-not-real-0123456789abcdef
      INTERNAL_SERVICE_SECRET: ci-e2e-service-secret-not-real-0123456789
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-e2e-admin-password-not-real
      E2E_SERVER: rust
      E2E_RUST_BIN: ${{ github.workspace }}/server/target/release/trinity
      E2E_RUST_PORT: "3300"
      E2E_BROWSER_CHANNEL: chrome
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: ci-e2e-admin-password-not-real
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          save-if: false
      - name: Build binary
        working-directory: server
        run: cargo build --release --locked -p trinity-bin
      - run: ./server/target/release/trinity migrate
      - run: ./server/target/release/trinity seed
      - run: pnpm --filter ./apps/web build:export
      - name: Playwright
        working-directory: apps/web
        run: pnpm e2e:static
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-static
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.6.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  # Lỗ hổng RustSec mới công bố cho phụ thuộc Rust (server/Cargo.lock). Ở ci.yml, advisories chỉ chạy trên PR đổi phụ thuộc.
  rust-advisories:
    name: Rust advisories (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: server/Cargo.toml
          command: check
          command-arguments: advisories

  # cargo-audit: cơ sở dữ liệu RustSec đọc trực tiếp, độc lập với cargo-deny ở trên. Ngoại lệ ở server/.cargo/audit.toml
  # (cùng danh sách với `advisories.ignore` của server/deny.toml; sửa cả hai nơi).
  rust-audit:
    name: Rust audit (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: server
        run: cargo audit --file Cargo.lock

  # Fuzz libFuzzer (server/fuzz, PLAN 6.3, X10): mỗi target một lượt, đêm 10 phút; chạy tay có thể nâng tới 1 giờ.
  rust-fuzz:
    name: Rust fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [mcp_jsonrpc, signature, webhook_payload, csv_cell, xlsx_read]
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: cargo fuzz run ${{ matrix.target }}
        working-directory: server
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
        run: |
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=10 \
            "fuzz/seeds/${{ matrix.target }}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: server/fuzz/artifacts/${{ matrix.target }}
          retention-days: 14

  osv:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
