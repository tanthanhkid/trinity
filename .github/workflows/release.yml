name: Release

# release-please đọc commit conventional (feat/fix/perf… trên main) → mở/cập nhật "Release PR" tăng phiên bản.
# Merge Release PR → tạo tag + GitHub Release → gọi docker.yml đẩy image GHCR. CHANGELOG.md viết tay giữ nguyên
# (skip-changelog); ghi chú phát hành tự sinh nằm trong GitHub Release.
# X08: Release PR cũng tăng phiên bản workspace Rust (`server/Cargo.toml`, dòng `x-release-please-version`) và job
# `sync-lock` cập nhật `server/Cargo.lock` cho khớp; sau khi phát hành, job `binaries` đính vào Release: binary `trinity`
# (amd64 + arm64) kèm SHA256SUMS, chữ ký cosign keyless, attestation, SBOM CycloneDX và danh sách giấy phép bên thứ ba.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      push: true

  # Tăng version workspace làm Cargo.lock lệch (mỗi crate nội bộ ghi version trong lock) và `--locked` sẽ đỏ.
  # Cập nhật lock ngay trên nhánh Release PR; commit bằng GITHUB_TOKEN không kích hoạt CI (xem docs/ci.md, mục Phát hành).
  sync-lock:
    name: Sync Cargo.lock
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: ./.github/actions/rust-toolchain
      - name: cargo update --workspace
        working-directory: server
        run: cargo update --workspace
      - name: Commit nếu có đổi
        run: |
          if git diff --quiet -- server/Cargo.lock; then echo "Cargo.lock đã khớp"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/Cargo.lock
          git commit -m "chore(release): đồng bộ server/Cargo.lock với phiên bản workspace"
          git push

  web-export:
    name: Web export (static)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: pnpm --filter ./apps/web build:export
      - run: scripts/check-web-export.sh apps/web/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-out
          path: apps/web/out
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Binary ${{ matrix.arch }}
    needs: [release-please, web-export]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-out
          path: apps/web/out
      - run: scripts/check-web-export.sh apps/web/out

      - name: Build binary
        working-directory: server
        run: |
          cargo build --release --locked -p trinity-bin
          ./target/release/trinity --version

      - name: Pack
        run: |
          name="trinity-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          install -m 0755 server/target/release/trinity "dist/${name}/trinity"
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      # Giấy phép Rust + SBOM sinh từ Cargo.lock của đúng tag; phần web nhúng trong binary cùng nằm trong sbom-web nếu pnpm hỗ trợ.
      - name: Third-party notices + SBOM
        if: matrix.arch == 'amd64'
        run: |
          cargo install --locked cargo-about cargo-cyclonedx
          scripts/gen-notices.sh dist/notices

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign (cosign keyless, bundle)
        run: |
          cosign sign-blob --yes --bundle "${ASSET}.cosign.bundle" "${ASSET}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload to release
        run: |
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" "${ASSET}.cosign.bundle" --clobber
          if [ -d dist/notices ]; then
            gh release upload "$TAG" dist/notices/* --clobber
          fi

  # Ghi chú phát hành: release-please sinh phần thay đổi; job này nối thêm hướng dẫn kiểm chứng (một lần, nhận biết bằng dấu).
  release-notes:
    name: Verification notes
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Append verification section
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if grep -q 'trinity-verify-section' <<< "$body"; then exit 0; fi
          {
            printf '%s\n\n' "$body"
            cat <<NOTES
          <!-- trinity-verify-section -->
          ## Kiểm chứng bản phát hành

          Binary: \`trinity-${TAG}-linux-<amd64|arm64>.tar.gz\`, kèm \`.sha256\`, \`.cosign.bundle\`, SBOM CycloneDX (\`sbom-*.cdx.json\`) và danh sách giấy phép Rust (\`THIRD_PARTY_RUST.md\`).

          \`\`\`bash
          sha256sum -c trinity-${TAG}-linux-amd64.tar.gz.sha256
          cosign verify-blob trinity-${TAG}-linux-amd64.tar.gz \\
            --bundle trinity-${TAG}-linux-amd64.tar.gz.cosign.bundle \\
            --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Trinity theo AGPL-3.0; giấy phép bên thứ ba: THIRD_PARTY_NOTICES.md.
          NOTES
          } > /tmp/notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
