# Cấu hình lai (issue D01): Rust nhận cổng công khai 3000, chuyển tiếp trang web sang Next (3001) và phần chưa viết sang Node (4000).
# CHỈ cho người vận hành tự dựng từ `main`. Bản phát hành công khai vẫn dùng docker-compose.yml một mình cho tới X06.
#
#   docker compose -f docker-compose.yml -f docker-compose.hybrid.yml up -d --build
#   lui:  docs/runbooks/hybrid.md, mục "Lui về cấu hình cũ"
#
# Cần Docker Compose >= 2.24 (`ports: !reset []`).
#
# Ba container `trinity`, `api`, `web` dùng CHUNG network namespace (`network_mode: service:trinity`):
#   - Node (4000) và Next (3001) chỉ nghe loopback, không công bố cổng, không ai ngoài container nối thẳng được;
#   - Rust gọi chúng qua 127.0.0.1 thật nên kiểm IP của Node giữ nguyên nghĩa (peer là loopback + header ký của Rust);
#   - tên `api` KHÔNG phân giải được trong namespace này, nên mọi địa chỉ phía Node/Next dùng 127.0.0.1;
#   - `postgres` vẫn gọi được theo tên vì namespace là của `trinity`, nằm trên mạng mặc định của compose.
# Rust là tiến trình biên duy nhất: TRUSTED_PROXY đặt ở `trinity`. Next và Node giữ header x-trinity-client-ip có chữ ký của Rust.
#
# Thứ tự: migrate (Prisma) -> Node -> Rust. `api` phải chung namespace với `trinity` nên không thể depends_on ngược lại;
# thay vào đó `trinity` chờ `migrate`, trả 503 cho công ty chưa migrate tới bản nó biên dịch cùng và 502 tới khi Node lên,
# còn cổng sức khoẻ của `trinity` đi qua toàn bộ chuỗi (Rust -> Node) nên chỉ xanh khi cả hai đã sẵn sàng.

x-hybrid-ownership: &ownership-file
  TRINITY_OWNERSHIP_FILE: /etc/trinity/ownership.json

services:
  trinity:
    build:
      context: .
      target: trinity
    restart: unless-stopped
    command: ["trinity", "serve"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trinity}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trinity}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-${SERVICE_SECRET}}
      # Biên duy nhất: TRUSTED_PROXY áp lên peer TCP của Rust (docs/deployment.md, "Client IP").
      TRUSTED_PROXY: ${TRUSTED_PROXY:-none}
      CLOUDFLARE_IP_RANGES: ${CLOUDFLARE_IP_RANGES:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /var/lib/trinity/storage
      INTEGRATIONS_PUBLIC_BASE_URL: ${INTEGRATIONS_PUBLIC_BASE_URL:-}
      INTEGRATIONS_SECRET_KEY: ${INTEGRATIONS_SECRET_KEY:-}
      TRINITY_HTTP_PORT: "3000"
      # Cổng tương thích 4000 đang do Node giữ trong cùng namespace, nên cổng của Rust đổi sang 4001 (phải khác 3000 và 4000).
      COMPAT_API_PORT: "4001"
      NODE_FALLBACK_URL: http://127.0.0.1:4000
      # Next (3001) nhận trang web; không đặt thì mọi thứ không thuộc Rust rơi về Node.
      WEB_UPSTREAM_URL: http://127.0.0.1:3001
      <<: *ownership-file
      DB_POOL_SIZE: ${HYBRID_RUST_DB_POOL_SIZE:-4}
    volumes:
      - ./deploy/hybrid:/etc/trinity:ro
      - storage:/var/lib/trinity/storage
      - uploads:/app/uploads
    ports:
      # Cổng công khai duy nhất của cả ba container. WEB_BIND=127.0.0.1 khi có Caddy/nginx trên host (TRUSTED_PROXY=cidr:docker-gateway).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Đi qua toàn chuỗi: Rust -> Node (/api/v1/health) và Rust -> Next. Lệnh do issue `serve` thêm (image không có shell/node).
      test: ["CMD", "trinity", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    network_mode: service:trinity
    ports: !reset []
    environment:
      <<: *ownership-file
      LISTEN_HOST: 127.0.0.1
      TRUSTED_PROXY: none
    volumes:
      - ./deploy/hybrid:/etc/trinity:ro
      - storage:/var/lib/trinity/storage
      - uploads:/app/uploads
    depends_on:
      trinity:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      args:
        MONOLITH_INTERNAL_URL: http://127.0.0.1:4000
    network_mode: service:trinity
    ports: !reset []
    environment:
      PORT: "3001"
      HOSTNAME: 127.0.0.1
      BACKEND_URL: http://127.0.0.1:4000
      MONOLITH_INTERNAL_URL: http://127.0.0.1:4000
      AUTH_SERVICE_URL: http://127.0.0.1:4000
      # Next sau Rust: giữ x-trinity-client-ip có chữ ký của Rust (đến từ loopback), không tự xác định lại.
      TRUSTED_PROXY: none
    healthcheck:
      # Qua Next tới Node: lệch bí mật web <-> API làm cổng đỏ (G16b).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
