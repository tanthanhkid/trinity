# Trinity — chạy cả bộ trên máy:
#
#   ./install.sh --up         # tạo .env với khoá ngẫu nhiên (không bao giờ ghi đè .env có sẵn), rồi chạy
#                             # `docker compose up --build -d`
#   (cách tay: cp .env.example .env, thay mọi giá trị change-me-*, docker compose up --build)
#
# Web + API: http://localhost:3000  (binary Rust `trinity` phục vụ web tĩnh và mọi route /api/v1 trên cùng cổng 3000;
# Swagger tại /docs khi SWAGGER_ENABLED=true)
# Quản trị đầu tiên: SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD trong .env (nếu mật khẩu để trống, một mật khẩu ngẫu nhiên
# được in MỘT lần ở: docker compose logs trinity)
#
# Dịch vụ (chỉ hai)
#   postgres   PostgreSQL 16
#   trinity    binary Rust: khi khởi động chạy `trinity migrate` (migration) và `trinity seed` (quản trị, tuỳ chọn mặc định,
#              dữ liệu mẫu khi SEED_DEMO_DATA=true; chạy lặp lại không đổi dữ liệu) rồi `trinity serve` trên cổng 3000
#
# Sau Cloudflare Tunnel: thêm tệp ghép docker-compose.tunnel.yml (Compose >= 2.24), xem tệp đó.

name: trinity

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trinity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  trinity:
    build:
      context: .
      target: trinity
    restart: unless-stopped
    # Migrate rồi seed rồi phục vụ; một bước lỗi thì container dừng (không phục vụ trên schema dở dang).
    command:
      - sh
      - -c
      - trinity migrate && trinity seed && exec trinity serve
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trinity}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trinity}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-${SERVICE_SECRET}}
      # Biên duy nhất: TRUSTED_PROXY áp lên peer TCP của Rust (docs/deployment.md, "Client IP").
      TRUSTED_PROXY: ${TRUSTED_PROXY:-none}
      CLOUDFLARE_IP_RANGES: ${CLOUDFLARE_IP_RANGES:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /var/lib/trinity/storage
      INTEGRATIONS_WEBHOOKS_ENABLED: ${INTEGRATIONS_WEBHOOKS_ENABLED:-false}
      INTEGRATIONS_MCP_ENABLED: ${INTEGRATIONS_MCP_ENABLED:-false}
      INTEGRATIONS_PUBLIC_BASE_URL: ${INTEGRATIONS_PUBLIC_BASE_URL:-}
      INTEGRATIONS_SECRET_KEY: ${INTEGRATIONS_SECRET_KEY:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      STORE_DOMAIN: ${STORE_DOMAIN:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      TRINITY_HTTP_PORT: "3000"
      # Cổng tương thích cho reverse proxy cũ còn trỏ `/notif-ws` vào cổng 4000 (docs/deployment.md); phải khác 3000.
      COMPAT_API_PORT: "4000"
      # Web tĩnh nằm sẵn trong image (/srv/web); đặt WEB_DIR khác để vá web mà không dựng lại binary.
      WEB_DIR: ${WEB_DIR:-/srv/web}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
    volumes:
      - storage:/var/lib/trinity/storage
      - uploads:/app/uploads
    ports:
      # Cổng công khai. WEB_BIND=127.0.0.1 khi có Caddy/nginx trên host (TRUSTED_PROXY=cidr:docker-gateway).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
      # Cổng tương thích chỉ ở loopback của host; API_PORT giữ nghĩa cũ (cổng phía host, có người đã đổi).
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image không có curl/node nên dùng lệnh của chính binary (GET /api/v1/health trên loopback).
      test: ["CMD", "trinity", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  storage:
  uploads:
