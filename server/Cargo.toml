# Backend Trinity viết lại bằng Rust — kế hoạch: docs/rust/PLAN.md (mục 4.1 bố cục crate, 4.2 thư viện).
# Crate mới chỉ cần tạo thư mục trong crates/ (glob bên dưới), không phải sửa danh sách members.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3.0-only"
repository = "https://github.com/tanthanhkid/trinity"
publish = false

# Phiên bản theo bảng PLAN 4.2 (bản ổn định mới nhất trên crates.io ngày 26/11/2026). Crate con dùng
# `foo = { workspace = true }` để cả workspace chung một phiên bản; Cargo.lock ghim bản chính xác.
[workspace.dependencies]
# Crate nội bộ
trinity-kernel = { path = "crates/trinity-kernel" }
trinity-db = { path = "crates/trinity-db" }
trinity-auth = { path = "crates/trinity-auth" }
trinity-rbac = { path = "crates/trinity-rbac" }
trinity-http = { path = "crates/trinity-http" }
trinity-jobs = { path = "crates/trinity-jobs" }
trinity-storage = { path = "crates/trinity-storage" }
trinity-realtime = { path = "crates/trinity-realtime" }
trinity-docgen = { path = "crates/trinity-docgen" }
trinity-obs = { path = "crates/trinity-obs" }
trinity-ops = { path = "crates/trinity-ops" }
trinity-testhooks = { path = "crates/trinity-testhooks" }
mod-system = { path = "crates/mod-system" }
mod-users = { path = "crates/mod-users" }
mod-contacts = { path = "crates/mod-contacts" }
mod-channel-guard = { path = "crates/mod-channel-guard" }
mod-store = { path = "crates/mod-store" }
mod-custom = { path = "crates/mod-custom" }
mod-oauth = { path = "crates/mod-oauth" }
mod-mcp = { path = "crates/mod-mcp" }
mod-reports = { path = "crates/mod-reports" }
mod-public-api = { path = "crates/mod-public-api" }
trinity-integrations = { path = "crates/trinity-integrations" }
mod-commerce = { path = "crates/mod-commerce" }
mod-kanban = { path = "crates/mod-kanban" }
mod-payroll = { path = "crates/mod-payroll" }
mod-pos = { path = "crates/mod-pos" }
mod-notify = { path = "crates/mod-notify" }
mod-hr = { path = "crates/mod-hr" }
mod-leads = { path = "crates/mod-leads" }
mod-settings = { path = "crates/mod-settings" }
mod-deals = { path = "crates/mod-deals" }

# Runtime, HTTP
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.8"
hyper = "1.13"
tower-http = "0.7"
libc = "0.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "http1", "http2", "service", "client-legacy"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Feature `rustls` của reqwest 0.13 kéo aws-lc-rs (cần cmake/C); dùng `rustls-no-provider` và cài provider `ring`
# một lần lúc khởi động (`rustls::crypto::ring::default_provider().install_default()`), cùng provider với sqlx.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }

# Postgres: truy vấn kiểm lúc biên dịch, chế độ offline (.sqlx/), không ORM, không `sqlx migrate` (PLAN 4.4, 4.5)
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "macros",
  "chrono",
  "json",
  "rust_decimal",
  "uuid",
] }

# Dữ liệu, mã hoá, thời gian
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: số thực đọc về đúng bit (mặc định serde_json làm tròn sai ở chữ số cuối, vd 106.66009616851807).
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
fancy-regex = "0.14"
form_urlencoded = "1.2"
url = "2.5"
jsonwebtoken = "12"
bcrypt = "0.19"
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
unicode-normalization = "0.1"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
garde = "0.23"
jsonschema = "0.63"
rust_decimal = "1.43"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
# Tiếng Việt: chuẩn hoá NFD (fold_vi) và so sánh chuỗi theo locale như `localeCompare` của V8 (K26). Cùng họ ICU4X
# 2.x mà url/idna đã kéo vào Cargo.lock.
icu_collator = "2.4"
icu_normalizer = "2.4"
icu_locale_core = "2.4"
moka = "0.12"

# Realtime, lưu trữ, tài liệu
socketioxide = "0.18"
# Driver S3: `aws-base` + `ring` thay cho `aws` (feature này kéo aws-lc-rs, cần cmake/C; cùng lý do với reqwest ở trên)
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
http = "1"
rust_xlsxwriter = "0.104"
calamine = "0.38"
printpdf = "0.13"
# Giải mã JPEG/PNG/WebP/GIF (ảnh tải lên), mã hoá JPEG; WebP có mất dữ liệu (ảnh bảng tin, như sharp `.webp({quality})`)
# cần libwebp qua crate `webp` vì `image` chỉ mã hoá WebP lossless (PLAN 4.2, K30).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
webp = { version = "0.3", default-features = false }
# Chuyển hồ sơ màu ICC (Display P3, Adobe RGB…) về sRGB như sharp; đã có sẵn trong cây phụ thuộc của `image`.
moxcms = "0.8"
handlebars = "6.4"
rust-embed = "8.14"

# Quan sát, CLI, cấp phát
tracing = "0.1"
tracing-log = "0.2"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# `rustls-no-provider`: cùng provider `ring` cài một lần ở main như reqwest/sqlx, không kéo aws-lc-rs.
sentry = { version = "0.49", default-features = false, features = ["reqwest", "rustls-no-provider", "backtrace", "contexts", "panic"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
utoipa = "6.0"
clap = { version = "4.6", features = ["derive"] }
mimalloc = "0.1"
thiserror = "2.0"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
uuid = { version = "1", default-features = false, features = ["std", "v4", "serde"] }
anyhow = "1.0"

# Test
insta = "1.49"
wiremock = "0.6"

[workspace.lints.cargo]
# Bảng phiên bản ở trên khai trước cho cả kế hoạch; crate nào chưa dùng thì chưa vào Cargo.lock.
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# Thông tin gỡ lỗi tối thiểu: biên dịch nhanh hơn, target/ nhỏ hơn (máy phát triển 16 GB dùng chung).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Giải mã/thu nhỏ ảnh (trinity-docgen, K30) chạy chậm ~40 lần khi không tối ưu: test ảnh mẫu 4000×3000 mất ~40 giây.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
