# cargo-about (https://embarkstudios.github.io/cargo-about/): sinh danh sách giấy phép bên thứ ba của workspace Rust.
# Chạy: `scripts/gen-notices.sh` ở gốc repo (X08). Danh sách `accepted` PHẢI khớp `[licenses].allow` của `deny.toml`
# (trừ AGPL-3.0-only của chính workspace); đổi một bên thì đổi bên kia cùng PR. Tương thích AGPL: docs/ci.md, mục "Giấy phép".
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Cùng tập nền tảng với deny.toml: bỏ nhánh phụ thuộc chỉ có trên Windows.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Crate của workspace (publish = false) mang AGPL-3.0-only, đã nêu ở LICENSE.
private = { ignore = true }
