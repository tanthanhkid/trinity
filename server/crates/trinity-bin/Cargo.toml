[package]
name = "trinity-bin"
description = "Binary `trinity`: serve | migrate | seed | channel-lock | healthcheck (lệnh được thêm dần theo issue)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "trinity"
path = "src/main.rs"

[features]
# K34: API điều khiển test (`/internal/test/*`) và tắt scheduler/worker tự chạy. Binary phát hành KHÔNG bật cờ này.
test-hooks = ["dep:trinity-testhooks", "trinity-testhooks/test-hooks"]

[dependencies]
mod-kanban = { workspace = true }
mod-payroll = { workspace = true }
mod-pos = { workspace = true }
mod-hr = { workspace = true }
mod-system = { workspace = true }
trinity-testhooks = { workspace = true, optional = true }
base64 = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
trinity-auth = { workspace = true }
trinity-db = { workspace = true }
mod-custom = { workspace = true }
mod-reports = { workspace = true }
mod-users = { workspace = true }
mod-leads = { workspace = true }
mod-channel-guard = { workspace = true }
mod-store = { workspace = true }
mod-oauth = { workspace = true }
mod-deals = { workspace = true }
trinity-http = { workspace = true }
trinity-kernel = { workspace = true }
trinity-ops = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
