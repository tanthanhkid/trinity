mod-system = { workspace = true }
mod-settings = { workspace = true }
mod-rbac-admin = { workspace = true }
mod-notify = { workspace = true }
trinity-testhooks = { workspace = true, optional = true }
base64 = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
trinity-auth = { workspace = true }
trinity-db = { workspace = true }
mod-custom = { workspace = true }
mod-reports = { workspace = true }
mod-setup = { workspace = true }
mod-users = { workspace = true }
mod-contacts = { workspace = true }
mod-auth = { workspace = true }
mod-apikeys = { workspace = true }
mod-leads = { workspace = true }
