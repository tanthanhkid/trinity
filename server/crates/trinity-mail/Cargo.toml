[package]
name = "trinity-mail"
description = "Gửi mail qua SMTP (lettre + rustls/ring): cấu hình từ env SMTP_*, MAIL_FROM, MAIL_REPLY_TO, SES_CONFIGURATION_SET; mẫu mail đăng nhập (#675)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# SMTP giả chạy trong tiến trình test (đọc thư mà không gửi ra ngoài); crate khác bật ở dev-dependencies.
testing = ["dep:tokio", "dep:base64"]
default = []

[dependencies]
lettre = { workspace = true }
tokio = { workspace = true, features = ["io-util"], optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
trinity-mail = { path = ".", features = ["testing"] }

[lints]
workspace = true
