# cargo-deny (https://embarkstudios.github.io/cargo-deny/): giấy phép tương thích AGPL-3.0, lỗ hổng, nguồn crate.
# Chạy: `cargo deny check` trong server/. CI: job `Rust deny` (PR, không bắt buộc), docs/ci.md.

[graph]
all-features = false
# Nền tảng chạy máy chủ (amd64/arm64 Linux) và máy phát triển macOS; bỏ nhánh phụ thuộc chỉ có trên Windows.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Mọi cảnh báo RustSec (lỗ hổng, crate bỏ bảo trì, bản bị rút) đều chặn; ngoại lệ ghi vào `ignore` kèm lý do.
yanked = "deny"
ignore = [
  # chrono và chrono-tz bị đánh dấu "không còn bảo trì", không phải lỗ hổng. chrono là lựa chọn của PLAN 4.2; chrono-tz
  # cho múi Asia/Ho_Chi_Minh khớp Intl của bản TS (K26). Đánh giá thay bằng jiff: issue #301.
  { id = "RUSTSEC-2026-0543", reason = "chrono không còn bảo trì, không có lỗ hổng; đánh giá jiff ở #301" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz không còn bảo trì, không có lỗ hổng; đánh giá jiff ở #301" },
]

[licenses]
# Chỉ giấy phép tương thích để phân phối kèm bản AGPL-3.0-only.
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Crate của workspace (publish = false) mang AGPL-3.0-only, không cần kiểm.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS chỉ dùng rustls (PLAN 4.2): không OpenSSL, không cmake.
  { name = "openssl-sys" },
  { name = "native-tls" },
  # Provider crypto của rustls chỉ dùng ring; aws-lc cần cmake và trình biên dịch C.
  { name = "aws-lc-sys" },
  { name = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
